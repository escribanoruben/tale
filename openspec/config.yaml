schema: spec-driven

context: |
  Project: Tales Vault System
  Language: Go (1.22+)
  Domain: Cryptographically random password generation with derived mnemonic phrases
  Modes: CLI random generation + interactive TUI for word selection
  Languages: English and Spanish (v1)
  Configuration: TOML profiles (default: english_default, spanish_default)
  Phrase template: per language (EN: adjective, noun, verb, noun; ES: noun, adjective, verb, noun)
  Default password length: 20 characters (5 blocks of 4)
  Alphabet: 20 most frequent word-initial letters per language (profile-defined)
  Word data: bundled static lists (nouns, adjectives, verbs only)
  Security: local-first, CSPRNG, no network calls at runtime
  Markdown: English only for OpenSpec artifacts and project docs

rules:
  proposal:
    - Include a Non-goals section when scope boundaries matter
    - Reference the blog executable requirement (EN + ES minimum)
  specs:
    - Use Given/When/Then scenario format
    - Every requirement must be testable
  design:
    - Document word-list provenance and normalization rules explicitly
    - Include rejection/regeneration strategy for uncovered letter blocks
  tasks:
    - Break data preparation (word lists) into separate tasks from core logic
