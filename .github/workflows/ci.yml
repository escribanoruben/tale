name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o tale ./cmd/tale

  go-mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: go.mod/go.sum aligned
        run: git diff --exit-code go.mod go.sum

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history, not just the push
      # The gitleaks-action wrapper now requires a paid license for
      # private repos, so scan with the official image directly (same
      # behavior on Forgejo and the GitHub mirror).
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --redact --verbose
